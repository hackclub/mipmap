[package]
name = "mipmap"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-governor = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hc_helper = { git = "https://github.com/breynard0/hc_helper" }
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate"] }
anyhow = "1.0.104"
aes-gcm = "0.11.1"
hex = "0.4.3"
